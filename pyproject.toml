[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "clm-jax"
version = "3.2.46"
description = "Differentiable JAX implementation of CLM5.0 BGC-Crop"
readme = "README.md"
requires-python = ">=3.11,<3.12"
license = "LGPL-2.1-or-later"
license-files = ["LICENSE"]
dependencies = [
  "jax==0.10.2",
  "jaxlib==0.10.2",
  "numpy>=2.4,<2.5",
  "xarray>=2026.7,<2027",
  "netCDF4>=1.7,<2",
  "cftime>=1.6,<2",
  "f90nml>=1.5,<2",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"clm_jax.physics" = ["LGPL-2.1.txt"]
